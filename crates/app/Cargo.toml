[package]
name = "macEverything-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "macEverything-app"
path = "src/main.rs"

[dependencies]
client = { path = "../client" }
protocol = { path = "../protocol" }
# session 直接复用 engine::query::SortKey(ADR-7:app 经 client 承载层依赖 engine 已许可;
# Rust 2018+ 依赖非传递可见,故显式声明)。
engine = { path = "../engine" }
# 0.37 一律带 system_fonts:仅 default_fonts 时中文渲染为方框(PoC-1 实测,
# 见 docs/specs/v2-ui/poc-results.md「与 plan 示意的接线差异」#3)。
# clipboard(2026-10-16 修「输入框无法粘贴」):default-features=false 会一并关掉
# egui-winit/clipboard,剪贴板集成(arboard)随之缺席——egui-winit 的 handle_key_event
# 只在 clipboard_shortcuts 下把 ⌘V 译成 Event::Paste,而 Clipboard::get 无 arboard 时
# 只读进程内兜底串(恒空,空串不再 push 事件),⌘V/⌘C/⌘X 三键全哑。
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "system_fonts", "clipboard"] }
objc2 = "0.6"
# NSResponder/NSAppearance:ui/theme.rs 经 NSApplication.effectiveAppearance 读系统外观
# (sharedApplication 挂在 NSResponder feature 下、外观 API 挂在 NSAppearance 下;
# 0.3.2 的 NSApplication/NSWindow feature 不含 NSResponder,须显式列出)。
objc2-app-kit = { version = "0.3", features = [
    "NSWindow",
    "NSApplication",
    "NSPanel",
    "NSResponder",
    "NSAppearance",
    # Task 14 平台层:NSScreen(多屏定位)、NSEvent(mouseLocation)、NSView(contentView
    # 取 first responder 目标)。
    "NSScreen",
    "NSEvent",
    "NSView",
    # Task 14b 切 Space 豁免:NSWorkspace + NSWorkspaceActiveSpaceDidChangeNotification
    # (通知经 NSWorkspace.notificationCenter() 注册;该 feature 连带 foundation/NSNotification)。
    "NSWorkspace",
    # Task 18 原生右键菜单:NSMenu/NSMenuItem(PoC-3 定稿路径;弹出还要求
    # NSMenuItem + NSResponder + NSView 三 feature 同时在场)。
    "NSMenu",
    "NSMenuItem",
    # 视觉重构:毛玻璃垫窗(PoC-7 定案)——NSVisualEffectView + NSColor(清底);
    # NSImage/NSBezierPath 用于生成圆角 maskImage(vibrancy 官方切形 API)。
    "NSVisualEffectView",
    "NSColor",
    "NSImage",
    "NSBitmapImageRep",
    "NSBezierPath",
    # Task 5 结果行真实图标:iconForContentType(UTI) 的 cfg 门槛(0.3.2 源码
    # NSWorkspace.rs:132 要求 NSImage + objc2-uniform-type-identifiers 两个 feature)。
    "objc2-uniform-type-identifiers",
    # Task E2 原生目录选择器:NSOpenPanel + runModal/URLs/path。0.3.2 生成的
    # NSOpenPanel impl 块还要求 NSSavePanel 与超类 NSPanel/NSResponder/NSWindow
    # 同在(前三者已列,补 NSSavePanel);打开的 "NSOpenPanel" 门控模块本身只
    # 连带 foundation 的 NSArray/NSURL 等。
    "NSOpenPanel",
    "NSSavePanel",
    # E5 后续:排除目录恢复默认改用原生确认弹窗。NSAlert.addButtonWithTitle:
    # 的 cfg 门控要求 NSButton + NSControl + NSResponder + NSView 四 feature
    # 同时在场(后两者已列);runModal/NSAlertSecondButtonReturn 还需 NSApplication。
    "NSAlert",
    "NSButton",
    "NSControl",
    # v2.3 拷贝文件:NSPasteboard.writeObjects(NSURL 数组)。
    "NSPasteboard",
] }
# objc2-app-kit 的公开签名用 NSPoint/NSRect/NSString(来自 objc2-foundation);
# 依赖非传递可见,Rust 侧须显式声明。NSObject 为自建观察者类的超类,NSNotification
# 为回调参数类型(Task 14b 直接引用,不依赖 feature 统一带来的可用性)。
# NSBundle(Task 20):autostart 经 NSBundle.mainBundle().bundleIdentifier() 校验
# 「在 .app 内」(PoC-5 坑①:无 bundle 调 register 不报错且注册独立条目)。
# 毛玻璃垫窗圆角遮罩(CALayer.cornerRadius;垫窗须与面板同圆角,否则四角露方角——实机)
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
# NSError/NSURL(Task 5):自定义图标经 NSURL.getResourceValue_forKey_error 读
# NSURLCustomIconKey;该方法以 Result<_, Retained<NSError>> 表达失败,两 feature 缺一不可。
objc2-foundation = { version = "0.3", features = [
    "NSGeometry",
    "NSString",
    "NSArray",
    "NSProcessInfo",
    "NSObject",
    "NSNotification",
    "NSBundle",
    "NSError",
    "NSURL",
    # i18n：NSLocale.preferredLanguages() 读取系统首选语言。
    "NSLocale",
    # v2.4 发现新版本：NSURLSession 拉取官网 version.json。
    "NSData",
    "NSURLRequest",
    "NSURLResponse",
    "NSURLSession",
    "block2",
    # 离线单测构造 NSHTTPURLResponse：其初始化器以 NSDictionary 入参为门控。
    "NSDictionary",
] }
# v2.4 发现新版本：NSURLSession completion handler 需要 block2；
# 版本号直通 Cargo.lock 中已有 0.6.2（与 objc2 0.6 同代）。
block2 = "0.6"
# Task 5 结果行真实图标:扩展名 → UTI(目录/无扩展名回落 UTCoreTypes)。
# 0.3.2 与 objc2 0.6 / objc2-foundation 0.3 同代;UTCoreTypes 提供 UTTypeFolder/UTTypeData。
objc2-uniform-type-identifiers = { version = "0.3.2", features = ["UTType", "UTCoreTypes"] }
# Task 5:NSImage.TIFFRepresentation → RGBA。image 已由 eframe/arboard 带入锁文件,
# 显式声明直接依赖;只要 png+tiff 解码面(与既有依赖取并集,不新增构建面)。
# png 保留:Task 9 吉祥物 PNG 解码也要用,勿随本任务收窄。
image = { version = "0.25.10", default-features = false, features = ["png", "tiff"] }
# Task 20 开机自启:ServiceManagement 的 objc2 官方 binding(实锁 0.3.2,与 objc2 0.6 同代;
# 生成代码自带 `#[link(name = "ServiceManagement", kind = "framework")]`,框架随链接加载)。
# 关默认 features:本任务只用 SMAppService(注册/注销/状态)+ SMErrors(错误码),
# block2/core-foundation/security 均用不到,不开。
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService", "SMErrors"] }
# v2.3 Quick Look(PoC-8 验证路径):QLPreviewPanel 单例 + dataSource + NSURL 预览项。
# 关默认 features:只需 QLPreviewPanel/QLPreviewItem 与 app-kit 桥接(其余 QuickLookUI
# 生成模块用不到),避免拖入 PDFKit/CoreGraphics 等构建面。
objc2-quick-look-ui = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "QLPreviewPanel", "QLPreviewItem"] }
raw-window-handle = "0.6"
# Task 15 全局热键(PoC-2 实锁 0.6.4;macOS 后端 = Carbon RegisterEventHotKey)。
# 注意 crate 文档:macOS 上 manager 必须在主线程创建,且需主线程事件循环在跑
# (eframe 的 NSApplication::run 即此循环;事件泵细节见 src/hotkey.rs 模块注释)。
global-hotkey = { version = "0.6", features = ["serde"] }
# 系统 UI 字体(SF Pro/SF Mono)只读 mmap 载入(堆粗查易修项:替代 fs::read 的
# ~8MB 堆拷贝;版本随 engine 已入锁文件)。
memmap2.workspace = true
# Task 21:热键动作「主队列直调」(`DispatchQueue::main().exec_async`,不等被节流的帧)。
# 版本与 PoC-4(scripts/poc/poc4_idle)实锁一致;macOS SDK 的 dispatch_get_main_queue
# 已内联为全局量,直接声明符号会链接失败,故走该 crate(其实现即 `&_dispatch_main_q`)。
dispatch2 = "0.3"
anyhow = "1"
# v2.1 Task 2:设置持久化(`settings.toml`;字号 + 两个全局快捷键)。
serde.workspace = true
toml.workspace = true
# 版本清单解析。
serde_json.workspace = true
# Task 17:完整窗口「修改时间」列按本地时区显示(localtime_r;cli 的 fmt_time 是 UTC)。
libc.workspace = true
log = { workspace = true, features = ["std"] }
# Task 16 菜单栏托盘(实锁 0.26.1;菜单走其 re-export 的 muda)。
# 关默认 features:默认的 libappindicator 只服务 Linux 后端,本仓交付面仅 macOS,
# 开启会把整棵 GTK/system-deps 依赖树拖进 Cargo.lock(Linux 目标依赖也入锁)。
# 将来若出 Linux 构建,须启用 `libappindicator` 或 `ksni`(crate 内 compile_error 强制)。
tray-icon = { version = "0.26.1", default-features = false }

[dev-dependencies]
# 设置持久化单测用独立临时目录(与 engine/client/cli 同版本)。
tempfile = "3"
# CJK 字体注入的 footprint 对比采样(#[ignore] 测试):复现 eframe 同款
# fontique 系统回退慢路径(tech.md §6.2.1 归因);生产路径不直接依赖它。
egui_system_font_provider = "0.37"
