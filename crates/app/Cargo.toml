[package]
name = "macEverything-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "macEverything-app"
path = "src/main.rs"

[dependencies]
client = { path = "../client" }
protocol = { path = "../protocol" }
# session 直接复用 engine::query::SortKey(ADR-7:app 经 client 承载层依赖 engine 已许可;
# Rust 2018+ 依赖非传递可见,故显式声明)。
engine = { path = "../engine" }
# 0.37 一律带 system_fonts:仅 default_fonts 时中文渲染为方框(PoC-1 实测,
# 见 docs/specs/v2-ui/poc-results.md「与 plan 示意的接线差异」#3)。
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "system_fonts"] }
egui_extras = "0.37"
objc2 = "0.6"
# NSResponder/NSAppearance:ui/theme.rs 经 NSApplication.effectiveAppearance 读系统外观
# (sharedApplication 挂在 NSResponder feature 下、外观 API 挂在 NSAppearance 下;
# 0.3.2 的 NSApplication/NSWindow feature 不含 NSResponder,须显式列出)。
objc2-app-kit = { version = "0.3", features = [
    "NSWindow",
    "NSApplication",
    "NSPanel",
    "NSResponder",
    "NSAppearance",
    # Task 14 平台层:NSScreen(多屏定位)、NSEvent(mouseLocation)、NSView(contentView
    # 取 first responder 目标)。
    "NSScreen",
    "NSEvent",
    "NSView",
    # Task 14b 切 Space 豁免:NSWorkspace + NSWorkspaceActiveSpaceDidChangeNotification
    # (通知经 NSWorkspace.notificationCenter() 注册;该 feature 连带 foundation/NSNotification)。
    "NSWorkspace",
    # Task 18 原生右键菜单:NSMenu/NSMenuItem(PoC-3 定稿路径;弹出还要求
    # NSMenuItem + NSResponder + NSView 三 feature 同时在场)。
    "NSMenu",
    "NSMenuItem",
] }
# objc2-app-kit 的公开签名用 NSPoint/NSRect/NSString(来自 objc2-foundation);
# 依赖非传递可见,Rust 侧须显式声明。NSObject 为自建观察者类的超类,NSNotification
# 为回调参数类型(Task 14b 直接引用,不依赖 feature 统一带来的可用性)。
# NSBundle(Task 20):autostart 经 NSBundle.mainBundle().bundleIdentifier() 校验
# 「在 .app 内」(PoC-5 坑①:无 bundle 调 register 不报错且注册独立条目)。
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSArray", "NSProcessInfo", "NSObject", "NSNotification", "NSBundle"] }
# Task 20 开机自启:ServiceManagement 的 objc2 官方 binding(实锁 0.3.2,与 objc2 0.6 同代;
# 生成代码自带 `#[link(name = "ServiceManagement", kind = "framework")]`,框架随链接加载)。
# 关默认 features:本任务只用 SMAppService(注册/注销/状态)+ SMErrors(错误码),
# block2/core-foundation/security 均用不到,不开。
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService", "SMErrors"] }
raw-window-handle = "0.6"
# Task 15 全局热键(PoC-2 实锁 0.6.4;macOS 后端 = Carbon RegisterEventHotKey)。
# 注意 crate 文档:macOS 上 manager 必须在主线程创建,且需主线程事件循环在跑
# (eframe 的 NSApplication::run 即此循环;事件泵细节见 src/hotkey.rs 模块注释)。
global-hotkey = "0.6"
anyhow = "1"
# Task 17:完整窗口「修改时间」列按本地时区显示(localtime_r;cli 的 fmt_time 是 UTC)。
libc.workspace = true
log = { workspace = true, features = ["std"] }
# Task 16 菜单栏托盘(实锁 0.26.1;菜单走其 re-export 的 muda)。
# 关默认 features:默认的 libappindicator 只服务 Linux 后端,本仓交付面仅 macOS,
# 开启会把整棵 GTK/system-deps 依赖树拖进 Cargo.lock(Linux 目标依赖也入锁)。
# 将来若出 Linux 构建,须启用 `libappindicator` 或 `ksni`(crate 内 compile_error 强制)。
tray-icon = { version = "0.26.1", default-features = false }
