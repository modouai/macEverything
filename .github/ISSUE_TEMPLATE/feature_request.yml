name: Feature request
description: 提出功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
