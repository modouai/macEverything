name: Bug report
description: 报告可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先搜索已有 Issue；安全问题请走 SECURITY.md 的私密报告渠道。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 期望行为与实际行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: App 关于页 / `macEverything --version` 中的版本
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本与芯片
      placeholder: macOS 14.6 / Apple M2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      render: shell
