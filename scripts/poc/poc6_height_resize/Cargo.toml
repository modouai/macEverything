[package]
name = "poc6-height-resize"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "poc6-height-resize"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSView"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry"] }
raw-window-handle = "0.6.2"
