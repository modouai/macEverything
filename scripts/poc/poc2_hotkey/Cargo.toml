[package]
name = "poc2-hotkey"
version = "0.0.0"
edition = "2021"

[dependencies]
global-hotkey = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSEvent", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSRunLoop"] }
