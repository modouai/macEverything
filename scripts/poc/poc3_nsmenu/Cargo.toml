[package]
name = "poc3-nsmenu"
version = "0.0.0"
edition = "2021"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSMenu", "NSMenuItem", "NSEvent", "NSView", "NSWindow", "NSApplication", "NSResponder", "NSScreen"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSGeometry"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
raw-window-handle = "0.6.2"
