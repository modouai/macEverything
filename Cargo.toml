[workspace]
resolver = "2"
members = ["crates/engine", "crates/protocol", "crates/client", "crates/cli", "crates/app"]
exclude = ["vendor/epaint", "scripts/spike-readdir", "scripts/poc/poc1_window", "scripts/poc/poc1b_nspanel", "scripts/poc/poc2_hotkey", "scripts/poc/poc3_nsmenu", "scripts/poc/poc4_idle", "scripts/poc/poc6_height_resize", "scripts/poc/poc7_vibrancy", "scripts/poc/poc8_quicklook"]

[workspace.package]
version = "2.7.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
memchr = "2"
rayon = "1"
unicode-normalization = "0.1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
log = "0.4"
fsevent-sys = "4"
core-foundation-sys = "0.8"
libc = "0.2"

# 本地补丁:epaint 字体图集的增量/清空路径在滚动时持续产生大块临时分配,
# macOS malloc 按尺寸类缓存 VM 段 → Malloc Large (empty) 无界累积(峰值 2.8GB)。
# 补丁四项:部分增量量化到 2 的幂、整图增量 Arc 共享、部分增量复用上传缓冲、
# clear 原地清空(见 vendor/epaint/MCE-PATCH.md)。
# **升级 egui/epaint 版本时必须重新同步此补丁**(vendor 目录以 0.37.0 为基线)。
[patch.crates-io]
epaint = { path = "vendor/epaint" }
