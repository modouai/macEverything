[workspace]
resolver = "2"
members = ["crates/engine", "crates/protocol", "crates/client", "crates/cli", "crates/app"]
exclude = ["scripts/spike-readdir", "scripts/poc/poc1_window", "scripts/poc/poc1b_nspanel", "scripts/poc/poc2_hotkey", "scripts/poc/poc3_nsmenu", "scripts/poc/poc4_idle"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
memchr = "2"
rayon = "1"
unicode-normalization = "0.1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
log = "0.4"
fsevent-sys = "4"
core-foundation-sys = "0.8"
libc = "0.2"
