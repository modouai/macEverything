[workspace]
resolver = "2"
members = ["crates/engine", "crates/cli"]
exclude = ["scripts/spike-readdir"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
memchr = "2"
rayon = "1"
unicode-normalization = "0.1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
log = "0.4"
fsevent-sys = "4"
core-foundation-sys = "0.8"
libc = "0.2"
